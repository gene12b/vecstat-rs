[package]
name = "vecstat" 
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Rust library for common statistics methods applied to collections requiring collection item trait fulfillment instead of statistics algorithm implementation."
readme = "README.adoc"
repository = "https://github.com/gene12b/vecstat-rs"

[features]
nonempty = ["dep:nonempty"]
# derive = ["dep:vecstat-derive"]
extension = []
partial = ["dep:try-partialord"]

[dependencies]
nonempty = {version = "0.12.0", optional = true}
thiserror = "2.0.20"
# vecstat-derive = { version = "0.1.0", path = "vecstat-derive", optional = true }
try-partialord = { version = "0.1.3", optional = true }
